<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes sous les pins · Comparateur</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191c;color:#f1f0ec;font:14px system-ui,sans-serif}header{padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:18px;margin:0;font-weight:500}button,select{font:inherit;background:#30343a;color:inherit;border:1px solid #535860;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#454b53}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#zoom{min-width:60px;text-align:center;font-variant-numeric:tabular-nums}.hint{color:#b9bec5;margin:0 24px 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:#4a4e53}section{min-width:0;background:#22252a}h2{font-size:14px;font-weight:500;margin:0;padding:12px 16px;display:flex;justify-content:space-between}h2 span{color:#b9bec5;font-weight:400}.view{height:calc(100vh - 156px);min-height:380px;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:#82858a}.view:active{cursor:grabbing}.view img{position:absolute;left:0;top:0;width:4960px;height:7015px;max-width:none;transform-origin:0 0;pointer-events:none;user-select:none}.cross{position:absolute;pointer-events:none;width:18px;height:18px;border:1px solid #e54242;border-radius:50%;display:none;transform:translate(-50%,-50%);z-index:1}.view:focus-visible{outline:3px solid #e9b95b;outline-offset:-3px}@media(max-width:650px){header{padding:12px;gap:10px}.hint{margin:0 12px 12px;font-size:12px}h2{padding:10px 6px;display:block;font-size:12px}h2 span{display:block;font-size:11px}.view{height:65vh}}
</style>
<header><h1>Notes sous les pins</h1><div class="tools"><button id="minus" aria-label="Dézoomer">−</button><output id="zoom" aria-live="polite"></output><button id="plus" aria-label="Zoomer">+</button><button id="fit">Page entière</button><select id="zone" aria-label="Aller à une zone"><option value="">Aller à une zone…</option><option value="village">Village et pierre</option><option value="haut">Bordure supérieure</option><option value="gauche">Bordure gauche</option><option value="chateau">Château</option></select></div></header>
<p class="hint">Molette pour zoomer · Glisser pour déplacer · Double-clic pour agrandir · Flèches et + / − au clavier. Les trois vues restent synchronisées.</p>
<main class="grid">
<section><h2>Version initiale <span>8 oct. · 10 h 54</span></h2><div class="view" tabindex="0" aria-label="Version initiale, vue synchronisée"><img src="assets/version-initiale.png" alt="Feuille originale Notes sous les pins" draggable="false"><i class="cross"></i></div></section>
<section><h2>Première correction <span>8 oct. · 22 h 01</span></h2><div class="view" tabindex="0" aria-label="Première correction, vue synchronisée"><img src="assets/premiere-correction.png" alt="Feuille après la première correction, conservée le 9 octobre" draggable="false"><i class="cross"></i></div></section>
<section><h2>Nouvelle version <span>29 oct. · 11 h 51</span></h2><div class="view" tabindex="0" aria-label="Nouvelle version, vue synchronisée"><img src="assets/version-29-octobre.png" alt="Feuille du 29 octobre" draggable="false"><i class="cross"></i></div></section>
</main>
<script>
(()=>{const views=[...document.querySelectorAll('.view')],imgs=views.map(v=>v.querySelector('img')),out=document.querySelector('#zoom');let cx=2480,cy=3507.5,scale=1,drag=null;const dims=v=>({w:v.clientWidth,h:v.clientHeight});function base(){const {w,h}=dims(views[0]);return Math.min(w/4960,h/7015)}function draw(){views.forEach((v,i)=>{const {w,h}=dims(v);imgs[i].style.transform=`translate(${w/2-cx*scale}px,${h/2-cy*scale}px) scale(${scale})`});out.value=Math.round(scale/base()*100)+' %'}function fit(){cx=2480;cy=3507.5;scale=base();draw();document.querySelector('#zone').value=''}function zoom(f,v,px,py){const {w,h}=dims(v),ns=Math.max(base(),Math.min(base()*60,scale*f));const ix=cx+(px-w/2)/scale,iy=cy+(py-h/2)/scale;cx=ix-(px-w/2)/ns;cy=iy-(py-h/2)/ns;scale=ns;draw()}function middle(f){const v=views[0],{w,h}=dims(v);zoom(f,v,w/2,h/2)}views.forEach(v=>{v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.002),v,e.clientX-r.left,e.clientY-r.top)},{passive:false});v.addEventListener('pointerdown',e=>{if(e.button!==0)return;v.focus();v.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx,cy,id:e.pointerId}});v.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){cx=drag.cx-(e.clientX-drag.x)/scale;cy=drag.cy-(e.clientY-drag.y)/scale;draw()}const r=v.getBoundingClientRect(),{w,h}=dims(v),ix=cx+(e.clientX-r.left-w/2)/scale,iy=cy+(e.clientY-r.top-h/2)/scale;views.forEach(q=>{const d=dims(q),c=q.querySelector('.cross');c.style.display='block';c.style.left=(d.w/2+(ix-cx)*scale)+'px';c.style.top=(d.h/2+(iy-cy)*scale)+'px'})});const end=()=>{drag=null};v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);v.addEventListener('lostpointercapture',end);v.addEventListener('pointerleave',()=>views.forEach(q=>q.querySelector('.cross').style.display='none'));v.addEventListener('dblclick',e=>{const r=v.getBoundingClientRect();zoom(2,v,e.clientX-r.left,e.clientY-r.top)});v.addEventListener('keydown',e=>{const step=80/scale;if(e.key==='ArrowLeft')cx-=step;else if(e.key==='ArrowRight')cx+=step;else if(e.key==='ArrowUp')cy-=step;else if(e.key==='ArrowDown')cy+=step;else if(e.key==='+'||e.key==='=')middle(1.5);else if(e.key==='-')middle(1/1.5);else if(e.key==='0')fit();else return;e.preventDefault();draw()})});document.querySelector('#plus').onclick=()=>middle(1.5);document.querySelector('#minus').onclick=()=>middle(1/1.5);document.querySelector('#fit').onclick=fit;document.querySelector('#zone').onchange=e=>{const zones={village:[4020,6370,1900,1300],haut:[2480,400,4960,1100],gauche:[420,3500,1100,2200],chateau:[4000,1000,1700,1700]};const z=zones[e.target.value];if(z){cx=z[0];cy=z[1];const {w,h}=dims(views[0]);scale=Math.min(w/z[2],h/z[3]);draw()}};let previous=0;new ResizeObserver(()=>{const b=base();scale=previous?scale*b/previous:b;previous=b;draw()}).observe(views[0]);fit();window.comparatorState=()=>({cx,cy,scale,transforms:imgs.map(i=>i.style.transform),loaded:imgs.map(i=>i.complete&&i.naturalWidth===4960)});})();
</script></html>
